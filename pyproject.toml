[project]
name = "further-bh-admissions-agent"
version = "1.0.0"
description = "Layered admissions agent for a behavioral health facility: deterministic guardrails around a narrow generative core."
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["."]
extend-exclude = [".venv", "diagrams"]

[tool.ruff.lint]
# Chosen for what this codebase actually risks, not for maximum noise:
# bugbear and the builtins/comprehension rules catch real defects, isort keeps
# import blocks stable across contributors, and the security rules matter in a
# project whose whole claim is a guardrail.
select = ["E", "F", "W", "I", "B", "C4", "UP", "SIM", "RUF", "S", "T20", "PTH"]
ignore = [
    # Long lines in prompt and regex literals; breaking them hurts readability
    # more than the width does. Code is still held to line-length above.
    "E501",
    # `class Intent(str, Enum)` is deliberate: it is the shape Pydantic and the
    # OpenAI structured-output schema both expect, and swapping it for StrEnum
    # would change nothing a caller can see.
    "UP042",
]

# BLE (blind-except) is deliberately NOT selected. The pipeline, tool and trace
# layers catch `Exception` on purpose — a tool failure or a full disk has to come
# back as data the agent can recover from, never as a dead turn — and every one
# of those sites already explains itself in a comment. Selecting the rule would
# mean sprinkling `# noqa` over decisions that are already documented.

[tool.ruff.lint.per-file-ignores]
# The eval runner is a CLI: printing is its output.
"evals/runner.py" = ["T20"]
# Tests assert, use short names, and build deliberately malformed input.
"tests/*" = ["S101", "S105", "S106", "S311", "T20"]

[tool.ruff.lint.isort]
known-first-party = ["app", "evals", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
filterwarnings = ["error::DeprecationWarning:app.*", "error::DeprecationWarning:evals.*"]

[tool.coverage.run]
source = ["app", "evals"]
omit = ["*/__init__.py"]

[tool.coverage.report]
skip_covered = false
show_missing = true
